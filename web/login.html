<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hy2dash · 登录</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="center">
  <form class="login" id="form" autocomplete="off">
    <div class="brand"><div class="brand-mark"></div>
      <div><h1>hy2dash</h1><p class="sub">traffic console · auth</p></div>
    </div>
    <label for="user">用户名</label>
    <input id="user" name="user" autocomplete="username" autofocus>
    <label for="pass">密码</label>
    <input id="pass" name="pass" type="password" autocomplete="current-password">
    <button class="primary" type="submit" id="go">验证并进入</button>
    <div class="msg" id="msg"></div>
    <div class="foot"><a href="register">没有账号？去注册</a></div>
  </form>
</div>
<script>
(() => {
  // 子路径部署（如 /zaku-zaku/login）必须回到 base 前缀，跳 "/" 会 404
  const BASE = location.pathname.replace(/\/[^/]*$/, "");
  document.querySelector(".foot a").href = BASE + "/register";
  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const go = document.getElementById("go");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    go.disabled = true;
    go.textContent = "验证中…";
    try {
      const r = await fetch(BASE + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: document.getElementById("user").value,
          pass: document.getElementById("pass").value,
        }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { location.href = BASE + "/"; return; }
      msg.textContent = d.error || ("登录失败 (" + r.status + ")");
    } catch (err) {
      msg.textContent = "网络错误：" + err.message;
    }
    go.disabled = false;
    go.textContent = "验证并进入";
  });
})();
</script>
</body>
</html>
