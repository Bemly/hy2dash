<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hy2dash · 登录</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="center">
  <div class="login">
    <div class="brand"><div class="brand-mark"></div>
      <div><h1>hy2dash</h1><p class="sub">traffic console · auth</p></div>
    </div>
    <button class="primary steam" id="steamGo">通过 Steam 登录</button>
    <div class="msg" id="msg"></div>
    <details class="admin">
      <summary>管理员密码登录</summary>
      <form id="form" autocomplete="off">
        <label for="user">用户名</label>
        <input id="user" name="user" autocomplete="username">
        <label for="pass">密码</label>
        <input id="pass" name="pass" type="password" autocomplete="current-password">
        <button class="primary" type="submit" id="go">验证并进入</button>
        <div class="msg" id="msg2"></div>
      </form>
    </details>
  </div>
</div>
<script>
(() => {
  const BASE = location.pathname.replace(/\/[^/]*$/, "");
  document.getElementById("steamGo").onclick = () => {
    location.href = BASE + "/api/steam/login";
  };
  const form = document.getElementById("form");
  const go = document.getElementById("go");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg2");
    msg.textContent = "";
    go.disabled = true;
    try {
      const r = await fetch(BASE + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: document.getElementById("user").value,
          pass: document.getElementById("pass").value,
        }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { location.href = BASE + "/"; return; }
      msg.textContent = d.error || ("登录失败 (" + r.status + ")");
    } catch (err) {
      msg.textContent = "网络错误：" + err.message;
    }
    go.disabled = false;
  });
})();
</script>
</body>
</html>
