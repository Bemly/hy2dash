<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hy2dash · 注册</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="center">
  <form class="login" id="form" autocomplete="off">
    <div class="brand"><div class="brand-mark"></div>
      <div><h1>hy2dash</h1><p class="sub">traffic console · register</p></div>
    </div>
    <p class="hint">用户名仅小写字母/数字/_/-，3~20 位；密码至少 8 位。注册即分配一条独立通道。</p>
    <label for="user">用户名</label>
    <input id="user" name="user" autocomplete="username" autofocus>
    <label for="pass">密码</label>
    <input id="pass" name="pass" type="password" autocomplete="new-password">
    <button class="primary" type="submit" id="go">注册并进入</button>
    <div class="msg" id="msg"></div>
    <div class="foot"><a href="login">已有账号？去登录</a></div>
  </form>
</div>
<script>
(() => {
  const BASE = location.pathname.replace(/\/[^/]*$/, "");
  document.querySelector(".foot a").href = BASE + "/login";
  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const go = document.getElementById("go");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    go.disabled = true;
    go.textContent = "注册中…";
    try {
      const r = await fetch(BASE + "/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: document.getElementById("user").value.trim(),
          pass: document.getElementById("pass").value,
        }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { location.href = BASE + "/"; return; }
      msg.textContent = d.error || ("注册失败 (" + r.status + ")");
    } catch (err) {
      msg.textContent = "网络错误：" + err.message;
    }
    go.disabled = false;
    go.textContent = "注册并进入";
  });
})();
</script>
</body>
</html>
